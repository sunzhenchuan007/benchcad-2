name: triage-welcome
# Station 0→1 of docs/SOP.md: when a family issue opens, tell the author
# (and any would-be triager) exactly what happens next.

on:
  issues:
    types: [opened]

jobs:
  welcome:
    if: contains(github.event.issue.labels.*.name, 'family')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              `Thanks for the proposal! **Next station: triage** — a maintainer checks the`,
              `evidence package against [docs/TRIAGE.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/TRIAGE.md)`,
              `(standard link real · dimensioned drawing · table with min/max rows · two numbers spot-checked).`,
              ``,
              `- ✅ complete → label \`triaged\`, then anyone may claim and build ([SOP](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/SOP.md))`,
              `- ⚠️ gaps → label \`needs-evidence\` + a comment naming what's missing — completing it is a credited contribution`,
              ``,
              `完整流程(中文指南): [GETTING_STARTED.zh.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/GETTING_STARTED.zh.md)。`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body });

name: require-issue-link
# Station 3 of the lifecycle (CONTRIBUTING.md): a family PR must link its family issue
# (`Closes #N`) — otherwise merge won't close the issue and dossier.yml
# can't post the acceptance evidence back to it.
#
# It also gates PR-body image links: this repo is PRIVATE, so anonymous
# raw.githubusercontent.com URLs 404 for every viewer — images must use the
# SHA-pinned blob form (`https://github.com/<owner>/<repo>/blob/<sha>/<path>?raw=true`,
# CONTRIBUTING.md "Getting the reference images"), and the pinned sha must
# actually contain the path (batch-7 PRs once pinned refs to a pre-refs commit).
#
# The image gate covers BOTH ways an image reaches a body — markdown
# `![alt](url)` and raw `<img src="url">` — and rejects a pin to a moving ref
# (branch name) for anything under designs/. Those two holes are how #308 and
# #316 both shipped a broken preview pair: the `_asm` rename landed in the last
# commit, the body's URLs got the new `designs/<fam>_asm/` path but kept the
# pre-rename sha, and the gate — which only looked at markdown-syntax images —
# saw zero URLs and passed green.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths: ["designs/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # the image check reads blobs via getContent
      issues: read
      pull-requests: read
    steps:
      - name: PR body must contain a closing keyword + issue number
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title || '';

            // This gate is scoped to family PRs by `paths: designs/**`, but an
            // infrastructure PR reaches it too as soon as it touches anything
            // under designs/ — a regenerated render, a fixture a framework gate
            // is tested against. Those have no family issue to close, so asking
            // for `Closes #N` fails them for doing nothing wrong (#317).
            // Fix PRs are NOT exempt: `[fix]` / `[family-fix]` /
            // `[family-assembly-fix]` all close their own issue.
            const infra = /^\s*\[(framework|docs|process|assets|status|chore|ci)\]/i;
            if (infra.test(title)) {
              core.info(
                `"${title}" is an infrastructure PR — no family issue to close, ` +
                'so the link is not required. It only reached this gate because ' +
                'the PR touches designs/**.');
              return;
            }

            const m = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!m) {
              core.setFailed(
                'PR description must link its family issue, e.g. `Closes #12` ' +
                '(CONTRIBUTING.md station 3). Edit the PR description — no new push needed. ' +
                'If this is not a family PR, prefix the title with its taxonomy tag ' +
                '([framework] / [docs] / [process] / [assets]) and this gate stands down. ' +
                '/ PR 描述里需要写 `Closes #<issue编号>` 关联 family issue,' +
                '直接编辑 PR 描述即可,不用重新 push。');
              return;
            }
            const n = Number(m[1]);
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: n });
              if (issue.pull_request)
                core.setFailed(`#${n} is a pull request, not an issue — link the family issue.`);
              else if (issue.state !== 'open')
                core.setFailed(`Issue #${n} is already closed — is this family already merged?`);
              else
                core.info(`links open issue #${n}: ${issue.title}`);
            } catch (e) {
              core.setFailed(`Issue #${n} does not exist in this repo (typo?).`);
            }
      - name: PR-body images must be SHA-pinned blob links that resolve (private repo)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const body = context.payload.pull_request.body || '';

            // An image reaches the body two ways and BOTH must be gated: markdown
            // `![alt](url)` and raw `<img src="url">` (what you must use to set a
            // width). Only reading the markdown form is why this gate was green on
            // the broken previews in #308/#316 — it found zero URLs.
            const urls = [...new Set([
              ...[...body.matchAll(/!\[[^\]]*\]\(\s*([^)\s]+)/g)].map(m => m[1]),
              ...[...body.matchAll(/<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["']/gi)].map(m => m[1]),
            ])];

            const strip = u => u.replace(/[?#].*$/, '');

            const rawRe = new RegExp(`^https://raw\\.githubusercontent\\.com/${owner}/${repo}/`, 'i');
            const bad = urls.filter(u => rawRe.test(u));
            if (bad.length) {
              core.setFailed(
                `${bad.length} image link(s) use raw.githubusercontent.com — this repo is PRIVATE, ` +
                'those 404 for every viewer. Use the SHA-pinned blob form instead: ' +
                `https://github.com/${owner}/${repo}/blob/<sha>/<path>?raw=true ` +
                '(CONTRIBUTING.md "Getting the reference images"). Edit the PR description — no new push needed. ' +
                '/ 私有仓库里 raw.githubusercontent 图片链接必然 404,请改用 blob/<sha>/<path>?raw=true 形式,' +
                '直接编辑 PR 描述即可,不用重新 push。');
              return;
            }

            // Any GitHub-hosted blob, including a contributor fork — a fork-hosted
            // image is exactly the kind that rots, so it gets verified too.
            const parse = (u) => {
              const s = strip(u);
              let m = s.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/([^/]+)\/(.+)$/);
              if (m) return { o: m[1], r: m[2], ref: m[3], path: m[4] };
              m = s.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
              if (m) return { o: m[1], r: m[2], ref: m[3], path: m[4] };
              return null;   // user-attachments upload / camo-proxied — GitHub-hosted, durable
            };

            const isSha = r => /^[0-9a-f]{7,40}$/i.test(r);
            const broken = [], moving = [], movingRefs = [];
            let checked = 0;

            for (const u of urls) {
              const p = parse(u);
              if (!p) continue;
              checked++;
              // A branch name is not a pin. Under designs/ it is a guaranteed future
              // 404 (every `_asm` rename moves the path), so it fails; a docs/assets/refs
              // image only rots if the asset is renamed, so it warns.
              if (!isSha(p.ref)) {
                (p.path.startsWith('designs/') ? moving : movingRefs).push(`${p.path} @ ${p.ref}`);
              }
              try {
                await github.rest.repos.getContent({
                  owner: p.o, repo: p.r, path: decodeURIComponent(p.path), ref: p.ref });
              } catch (e) {
                if (e.status === 403) {   // >1 MB blob, or a repo we cannot read — cannot verify
                  core.info(`skipped ${p.o}/${p.r} ${p.path}: ${e.message}`);
                  continue;
                }
                broken.push(`${p.o}/${p.r} ${p.path} @ ${p.ref.slice(0, 9)}`);
              }
            }

            for (const m of movingRefs) {
              core.warning(
                `image pinned to a moving ref: ${m} — re-pin to the commit sha. A branch ref ` +
                'silently breaks the image the moment the asset is renamed or the branch is deleted. ' +
                '/ 图片钉在分支名上,请改钉 commit sha,否则文件一改名/分支一删图就碎。');
            }

            const errs = [];
            if (broken.length) {
              errs.push(
                `image path(s) missing at the pinned commit: ${broken.join('; ')} — ` +
                're-pin to the commit that actually contains the file. If the family dir was just renamed ' +
                '(e.g. to the `_asm` form), the previews now live at the NEW path only from the rename ' +
                'commit onward — bump every image url to the new head sha. ' +
                '/ 图片路径在所钉的 commit 下不存在:若刚把目录改名(如 _asm),预览图只在改名那个 commit 之后才有新路径,' +
                '请把所有图片 url 的 sha 一并更新到最新 head。');
            }
            if (moving.length) {
              errs.push(
                `designs/ image(s) pinned to a moving ref instead of a sha: ${moving.join('; ')} — ` +
                'a branch ref breaks as soon as the family dir is renamed or the branch is deleted. ' +
                'Use blob/<sha>/<path>?raw=true. ' +
                '/ designs/ 下的图片钉在分支名上,家族目录一改名或分支一删就碎,请改用 blob/<sha>/<path>?raw=true。');
            }
            if (errs.length) {
              core.setFailed(errs.join(' || ') + ' Edit the PR description — no new push needed.');
            } else {
              core.info(`all ${checked} repo-hosted image link(s) OK (${urls.length} image url(s) in body)`);
            }

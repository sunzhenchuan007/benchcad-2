name: validate-designs

# `validate` is a REQUIRED status check (repo ruleset). A required check must
# report a status on EVERY PR, so this workflow triggers on all PRs (no `paths`
# filter) and no-op-passes when nothing it cares about changed — otherwise a
# docs/CI-only PR would leave `validate` "Expected — waiting" forever and could
# never merge. The push trigger keeps its paths filter (no such requirement).
on:
  pull_request:
  push:
    branches: [main]
    paths: ["designs/**", "framework/**", "pyproject.toml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    # A framework change re-validates every family, so this scales with the
    # board (13 families ate most of 30 min; the target is 300). Raised for
    # headroom now that the preview render is capped; if it is ever hit again
    # the answer is to shard the family list across a matrix, not to keep
    # nudging this number.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to diff against the base for changed-family detection
      - name: detect whether this change needs validation
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.base_ref }}"
            DIFF=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            DIFF=""
          fi
          echo "$DIFF" > /tmp/diff.txt
          if [ -z "$DIFF" ] || echo "$DIFF" | grep -qE '^(designs/|framework/|pyproject\.toml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No designs/framework/pyproject changes — 'validate' passes as a no-op (required check still reports)."
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.11"
      - run: uv sync
        if: steps.scope.outputs.run == 'true'
      # the hosted runner has no display, EGL, or OSMesa, so VTK segfaults on
      # any offscreen render (which is also why the preview step below never
      # actually rendered before). The vtk wheel dlopens the system OSMesa at
      # runtime — install it and VTK gets a software offscreen backend.
      - name: install OSMesa (headless VTK rendering)
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q libosmesa6
      # framework unit tests (tests/): fast, hermetic fixture families — they
      # gate the shared tooling the same way `bench2 validate` gates a design
      - name: framework unit tests
        if: steps.scope.outputs.run == 'true'
        run: uv run python -m unittest discover -s tests -v
      # WHICH families to validate. A family PR validates its own family — that
      # part is obvious. The interesting case is a framework/pyproject change,
      # which can affect ANY family:
      #
      #   on a PR  -> the changed families + a small SMOKE set (see env below)
      #   on main  -> every family, because this is the version that lands
      #
      # Sweeping every family on every framework PR is what made this job 96% of
      # the repo's CI spend: seven open PRs each carrying a framework diff meant
      # seven full sweeps per round of pushes, all re-proving the same thing. It
      # also does not scale — 13 families already take ~12 min, and the board
      # only grows.
      #
      # The trade-off, stated plainly: a framework change that breaks a family
      # OUTSIDE the smoke set is now caught when it merges rather than on the
      # PR. The main-push sweep is a real gate and fails loudly, so it is still
      # caught before anything is built on top of it — one sweep per merge
      # instead of one per PR per push.
      - name: pick families to validate
        if: steps.scope.outputs.run == 'true'
        env:
          # Chosen for framework COVERAGE, not at random — between them these hit
          # every code path a framework change is likely to break:
          #   example_tee_bracket        no refine, no geomlib, no coverage — the plainest path
          #   simplex_sprocket           geomlib inlining + refine + coverage (nothing else exercises geomlib)
          #   weld_neck_flange           the widest table-driven spec (11 params, refine + coverage)
          #   knurled_thumb_screw_din464 the heaviest booleans (compound cutter, thread rings)
          # The assembly gates are covered by tests/ (hermetic fixture families),
          # which run on every one of these jobs regardless.
          SMOKE: "example_tee_bracket simplex_sprocket weld_neck_flange knurled_thumb_screw_din464"
        run: |
          DIFF=$(cat /tmp/diff.txt)
          CHANGED=$(echo "$DIFF" | grep -oE '^designs/[^/]+/' | cut -d/ -f2 | sort -u || true)
          if [ -z "$DIFF" ] || echo "$DIFF" | grep -qE '^(framework/|pyproject\.toml)'; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              { echo "$CHANGED"
                for f in $SMOKE; do [ -d "designs/$f" ] && echo "$f"; done
              } | grep . | sort -u > /tmp/fams.txt
              TOTAL=$(find designs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
              PICKED=$(grep -c . /tmp/fams.txt || echo 0)
              echo "::notice::Framework change on a PR: validating ${PICKED} of ${TOTAL} families — the ones this PR touches, plus a smoke set covering the geomlib / refine / coverage / boolean-heavy paths. The FULL sweep over all ${TOTAL} runs on merge to main."
            else
              find designs -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort > /tmp/fams.txt
              echo "framework/tooling change on main -> validating every family"
            fi
          else
            echo "$CHANGED" | grep . > /tmp/fams.txt || true
          fi
          echo "families to validate:"; cat /tmp/fams.txt
      - name: validate the changed families (same gates as `bench2 validate`)
        if: steps.scope.outputs.run == 'true'
        id: validate
        run: |
          set -o pipefail
          {
            echo "## bench2 validate"
            echo
            fail=0
            if [ ! -s /tmp/fams.txt ]; then echo "_(no design families touched by this change)_"; fi
            while read -r fam; do
              [ -d "designs/$fam" ] || continue
              echo "### $fam"
              echo '```'
              uv run bench2 validate "$fam" --seeds 4 || fail=1
              echo '```'
            done < /tmp/fams.txt
            exit $fail
          } | tee report.md
      - name: render previews
        if: always() && steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        run: |
          # `always()` runs this even when a step BEFORE family scoping failed,
          # so the list may not exist — then there is nothing to render
          [ -f /tmp/fams.txt ] || { echo "no family list — skipping"; exit 0; }
          # Previews are a non-gating smoke check — every family is `|| true` and
          # the output is uploaded for a reviewer to look at, while `validate`
          # above is the thing that actually gates. A family PR lists one family
          # and renders it in full. A framework change lists EVERY family, and
          # rendering four sheets each through software OSMesa overruns the job
          # timeout long before it finishes: 13 families already did (SIGTERM
          # mid-render), and the board targets 300. So cap it — and SAY what was
          # skipped, because a silent truncation reads as "everything rendered".
          TOTAL=$(grep -c . /tmp/fams.txt || echo 0)
          CAP=4
          if [ "$TOTAL" -gt "$CAP" ]; then
            echo "::notice::Repo-wide change: rendering previews for the first ${CAP} of ${TOTAL} families. All ${TOTAL} were VALIDATED above — only the preview smoke render is capped, to stay inside the job timeout."
            head -n "$CAP" /tmp/fams.txt > /tmp/fams_preview.txt
          else
            cp /tmp/fams.txt /tmp/fams_preview.txt
          fi
          while read -r fam; do
            [ -d "designs/$fam" ] && (uv run bench2 preview "$fam" --per-diff 3 || true)
          done < /tmp/fams_preview.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        with:
          name: previews
          path: designs/*/preview.png
          if-no-files-found: ignore
      # The report COMMENT is posted by validate-report.yml (workflow_run): on
      # fork PRs this job's token is read-only, so commenting from here fails
      # with "Resource not accessible by integration" — exactly for the external
      # contributors the report exists for. We hand the report + PR number over
      # via an artifact instead.
      - name: package report for validate-report.yml
        if: always() && steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/validate-report
          cp report.md /tmp/validate-report/report.md 2>/dev/null || echo 'validate report missing — check the job log.' > /tmp/validate-report/report.md
          echo "${{ github.event.pull_request.number }}" > /tmp/validate-report/pr.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        with:
          name: validate-report
          path: /tmp/validate-report/

  status-board:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the rebase below needs history, not a depth-1 clone
      - name: regenerate STATUS.md
        run: |
          python3 -c "import sys; sys.path.insert(0,'framework'); from pathlib import Path; from bench2.status import main; main(Path('.'))"
      - name: commit if changed
        run: |
          git config user.name "benchcad-bot"
          git config user.email "actions@github.com"
          git add docs/STATUS.md
          # Rebase before pushing. This job checks out the pushed sha, so any
          # merge that lands while it runs makes the push non-fast-forward and
          # it dies with "! [rejected] main -> main (fetch first)" — which is
          # what has been happening, so the board silently stopped refreshing.
          # credits.yml and registry.yml already commit-then-rebase-then-push;
          # this one never pulled at all.
          git diff --cached --quiet || (git commit -m "status: refresh board [skip ci]" && git pull --rebase origin main && git push)

name: dossier-closeout
# Station 7 of the lifecycle (CONTRIBUTING.md): when a family PR merges, post the acceptance
# evidence (previews + validate summary) back to the family issue, so the
# issue reads as the complete dossier.

#
# `pull_request_target`, not `pull_request`: a PR from a FORK gets a read-only
# GITHUB_TOKEN under `pull_request` regardless of `permissions:`, so the
# close-out comment dies with "Resource not accessible by integration" — for
# exactly the outside contributors this dossier is written for. benchcad-2 hit
# that on its first four fork PRs (#35/#36/#38/#74).
#
# SECURITY: `pull_request_target` runs with a WRITE token in base-repo context.
# This job is safe because it fires only after merge, checks out NOTHING, and
# executes no PR-supplied code — it only reads PR metadata over the API and
# writes one issue comment. Do not add a checkout of the PR head here.
#
# `workflow_dispatch` with a PR number backfills a close-out that was missed.

on:
  pull_request_target:
    types: [closed]
    paths: ["designs/**"]
  workflow_dispatch:
    inputs:
      pr:
        description: "Merged family PR number to backfill the close-out for"
        required: true

jobs:
  closeout:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - name: post close-out comment on the linked issue
        uses: actions/github-script@v7
        with:
          script: |
            let pr = context.payload.pull_request;
            if (!pr) {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: Number(${{ toJSON(inputs.pr || '0') }}) }));
              if (!pr.merged_at) { core.info('PR not merged — nothing to close out'); return; }
            }
            const body = pr.body || '';
            const m = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!m) { core.info('no linked issue'); return; }
            const issue = Number(m[1]);
            // family dir from the diff
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number, per_page: 100 });
            const fam = (files.map(f => f.filename.match(/^designs\/([^/]+)\//))
                              .find(Boolean) || [])[1];
            if (!fam) { core.info('no designs/ change'); return; }
            // blob?raw=true renders for authenticated viewers on a private repo.
            // Pin to the MERGE COMMIT, never to main: main moves, and the next
            // rename of this family dir (the `_asm` form) would turn every link
            // in this comment into a 404 — which is what happened to issue #96.
            const mergeSha = pr.merge_commit_sha;
            const sha = mergeSha.slice(0, 7);
            const raw = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${mergeSha}/designs/${fam}`;

            // Only link the renders this family actually ships — `preview.png` is
            // not universal (8 of 13 families on main have no such file), and a
            // dead "Overview grid" link is exactly the rot this comment records.
            let names = null;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: `designs/${fam}`, ref: mergeSha });
              if (Array.isArray(data)) names = data.map(f => f.name);
            } catch (e) { core.info(`could not list designs/${fam}: ${e.message}`); }
            const has = n => names === null || names.includes(n);
            const link = (label, file) => `[${label}](${raw}/${file}?raw=true)`;

            const extras = [
              has('preview.png') ? link('preview.png', 'preview.png') : null,
              has('preview_hard_zoom.png') ? link('preview_hard_zoom.png', 'preview_hard_zoom.png') : null,
              has('preview_parts.png') ? link('preview_parts.png', 'preview_parts.png') : null,
            ].filter(Boolean);

            const comment = [
              `## ✅ Merged — acceptance evidence (dossier close-out)`,
              ``,
              `Family \`${fam}\` landed in ${sha} via #${pr.number}.`,
              ``,
              `| Benchmark 4-views | Extremes (min & max draw) |`,
              `|---|---|`,
              `| ![views](${raw}/preview_views.png?raw=true) | ![extremes](${raw}/preview_extremes.png?raw=true) |`,
              ``,
              (extras.length ? `Other renders: ${extras.join(' · ')} · ` : '') +
                `gates: \`bench2 validate ${fam}\` PASS (checked in CI on the PR).`,
              ``,
              `Next stations: factory batch → release — track on [STATUS.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/STATUS.md).`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue, body: comment });
